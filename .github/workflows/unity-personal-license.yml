name: Build Prism Stack iOS

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build-ios:
    name: Licensed Unity iOS export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNITY_NO_CLI_INVOKED_TELEMETRY: "1"
      UNITY_NO_UPDATE_CHECK: "1"
      UNITY_NO_CONSENT_PROMPT: "1"
      UNITY_SERVICE_ACCOUNT_ID: ${{ secrets.UNITY_SERVICE_ACCOUNT_ID }}
      UNITY_SERVICE_ACCOUNT_SECRET: ${{ secrets.UNITY_SERVICE_ACCOUNT_SECRET }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Unity CLI
        shell: bash
        run: |
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_CHANNEL=beta bash
          "$HOME/.local/bin/unity" --version

      - name: Sign in to Unity
        if: env.UNITY_SERVICE_ACCOUNT_ID == '' || env.UNITY_SERVICE_ACCOUNT_SECRET == ''
        shell: bash
        run: |
          login_log="$RUNNER_TEMP/unity-auth.log"
          "$HOME/.local/bin/unity" auth login --format human >"$login_log" 2>&1 &
          login_pid=$!
          trap 'kill "$login_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            sign_in_url=$(grep -Eo 'https://services\.api\.unity\.com/app-linking/[^[:space:]]+' "$login_log" | head -1 || true)
            if [ -n "$sign_in_url" ]; then
              echo "::notice title=Unity sign-in::$sign_in_url"
              GH_TOKEN="${{ github.token }}" gh api \
                --method POST \
                "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
                -f state=pending \
                -f context=unity-auth \
                -f description='Approve Unity CLI sign-in' \
                -f target_url="$sign_in_url" >/dev/null
              break
            fi
            if ! kill -0 "$login_pid" 2>/dev/null; then
              wait "$login_pid"
            fi
            sleep 1
          done

          test -n "${sign_in_url:-}"
          wait "$login_pid"
          trap - EXIT

      - name: Verify unattended Unity authentication
        if: env.UNITY_SERVICE_ACCOUNT_ID != '' && env.UNITY_SERVICE_ACCOUNT_SECRET != ''
        shell: bash
        run: "$HOME/.local/bin/unity" auth status --non-interactive --format json

      - name: Activate Unity Personal
        shell: bash
        run: "$HOME/.local/bin/unity license activate --personal --accept-eula --format json"

      - name: Verify license
        shell: bash
        run: "$HOME/.local/bin/unity license status --format json"

      - name: Install Unity Editor and iOS module
        shell: bash
        run: >-
          "$HOME/.local/bin/unity" install 2022.3.30f1
          -c 70558241b701
          -m ios
          --format github

      - name: Export Xcode project
        shell: bash
        run: >-
          "$HOME/.local/bin/unity" build .
          --editor-version 2022.3.30f1
          --target iOS
          --execute-method BuildScript.BuildIos
          --timeout 3600
          --format github

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: prism-stack-ios-export
          path: build/iOS
          if-no-files-found: error
          retention-days: 3
