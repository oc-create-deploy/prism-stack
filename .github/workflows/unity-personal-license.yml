name: Build Prism Stack iOS

on:
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

jobs:
  build-ios:
    name: Licensed Unity iOS export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNITY_NO_CLI_INVOKED_TELEMETRY: "1"
      UNITY_NO_UPDATE_CHECK: "1"
      UNITY_NO_CONSENT_PROMPT: "1"
      UNITY_BROWSER_STORAGE_STATE: ${{ secrets.UNITY_BROWSER_STORAGE_STATE }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Unity CLI
        shell: bash
        run: |
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_CHANNEL=beta bash
          "$HOME/.local/bin/unity" --version

      - name: Install browser authorization helper
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Sign in to Unity automatically
        shell: bash
        run: |
          state_file="$RUNNER_TEMP/unity-browser-state.json"
          STATE_FILE="$state_file" node -e 'require("fs").writeFileSync(process.env.STATE_FILE, process.env.UNITY_BROWSER_STORAGE_STATE, { mode: 0o600 })'

          login_log="$RUNNER_TEMP/unity-auth.log"
          "$HOME/.local/bin/unity" auth login --format human >"$login_log" 2>&1 &
          login_pid=$!
          trap 'kill "$login_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            sign_in_url=$(grep -Eo 'https://services\.api\.unity\.com/app-linking/[^[:space:]]+' "$login_log" | head -1 || true)
            if [ -n "$sign_in_url" ]; then
              break
            fi
            if ! kill -0 "$login_pid" 2>/dev/null; then
              wait "$login_pid"
            fi
            sleep 1
          done

          test -n "${sign_in_url:-}"
          node .github/scripts/unity-browser-authorize.js "$state_file" "$sign_in_url" &
          browser_pid=$!
          wait "$login_pid"
          wait "$browser_pid"
          trap - EXIT
          "$HOME/.local/bin/unity" auth status --format json

      - name: Activate Unity Personal
        shell: bash
        run: >-
          "$HOME/.local/bin/unity" license activate --personal --accept-eula --format json

      - name: Verify license
        shell: bash
        run: >-
          "$HOME/.local/bin/unity" license status --format json

      - name: Install Unity Editor and iOS module
        shell: bash
        run: >-
          "$HOME/.local/bin/unity" install 2022.3.30f1
          -c 70558241b701
          -m ios
          --format github

      - name: Export Xcode project
        shell: bash
        run: >-
          "$HOME/.local/bin/unity" build .
          --editor-version 2022.3.30f1
          --target iOS
          --execute-method BuildScript.BuildIos
          --timeout 3600
          --format github

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: prism-stack-ios-export
          path: build/iOS
          if-no-files-found: error
          retention-days: 3
