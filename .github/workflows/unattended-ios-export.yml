name: Unattended Prism Stack iOS Export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Unity Xcode project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.30f1
          targetPlatform: iOS
          buildMethod: BuildScript.BuildIos
          allowDirtyBuild: false

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: prism-stack-ios-export
          path: build/iOS
          if-no-files-found: error
          retention-days: 3
