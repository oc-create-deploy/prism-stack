name: Bootstrap Unity CI Session

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Check out bootstrap certificate
        uses: actions/checkout@v4

      - name: Install browser automation
        shell: bash
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Start Unity sign-in and preserve security challenge
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            await page.goto('https://login.unity.com/en/sign-in', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(5000);
            if (await page.locator('input[name="email"]').count() === 0 && page.url().includes('/sign-up')) {
              await page.getByRole('link', { name: 'Sign in' }).click();
              await page.waitForTimeout(3000);
            }
            if (await page.locator('input[name="email"]').count() === 0) {
              console.log(JSON.stringify({
                stage: 'login-page',
                title: await page.title(),
                url: page.url(),
                text: (await page.locator('body').innerText()).slice(0, 1800),
              }));
              await page.screenshot({ path: 'unity-login.png', fullPage: true });
              process.exitCode = 3;
              await browser.close();
              return;
            }
            await page.locator('input[name="email"]').fill(process.env.UNITY_EMAIL);
            await page.getByRole('button', { name: 'Continue' }).click();
            await page.locator('input[name="password"]').fill(process.env.UNITY_PASSWORD);
            await page.getByRole('button', { name: 'Sign in' }).click();
            await page.waitForTimeout(5000);

            const loginText = (await page.locator('body').innerText()).replaceAll(process.env.UNITY_EMAIL, '[account]');
          if (page.url().includes('/security-check')) {
            await page.context().storageState({ path: 'unity-security-state.json' });
            console.log(JSON.stringify({ stage: 'security-check', url: page.url(), ready: true }));
            await browser.close();
            return;
          }
          if (page.url().includes('login.unity.com')) {
            console.log(JSON.stringify({ stage: 'login', url: page.url(), text: loginText.slice(0, 1800) }));
            process.exitCode = 2;
            await browser.close();
            return;
          }

            await page.goto('https://cloud.unity.com/home/organizations', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(5000);
            const links = await page.locator('a').evaluateAll(elements => elements.map(element => ({
              text: (element.innerText || '').trim(),
              href: element.href,
            })).filter(link => /service|admin|organization/i.test(`${link.text} ${link.href}`)).slice(0, 80));
            const bodyText = (await page.locator('body').innerText()).replaceAll(process.env.UNITY_EMAIL, '[account]');
            console.log(JSON.stringify({ stage: 'dashboard', url: page.url(), links, text: bodyText.slice(0, 3000) }));
          await browser.close();
          })().catch(error => {
            console.error(error.name + ': ' + error.message);
          process.exit(1);
          });
          NODE

      - name: Encrypt security challenge state
        if: hashFiles('unity-security-state.json') != ''
        run: >-
          openssl cms -encrypt -aes256 -binary -outform DER
          -recip .github/unity-bootstrap-cert.pem
          -in unity-security-state.json
          -out unity-security-state.cms

      - name: Upload encrypted security challenge
        if: hashFiles('unity-security-state.cms') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unity-security-challenge
          path: unity-security-state.cms
          if-no-files-found: error
          retention-days: 1

      - name: Upload login diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unity-login-diagnostic
          path: unity-login.png
          if-no-files-found: ignore
          retention-days: 1
