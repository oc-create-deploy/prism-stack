name: Native Gameplay QA

on:
  workflow_dispatch:
    inputs:
      export_run_id:
        description: Workflow run containing the Unity iOS export
        required: true

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
      MAESTRO_CLI_NO_ANALYTICS: 'true'
      MAESTRO_DISABLE_UPDATE_CHECK: 'true'
      APP_SLUG: prism-stack
      APP_BUNDLE_ID: com.play.blockpuzzle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned open-source native touch driver
        run: |
          curl -fsSL https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-dist/maestro/." "$HOME/.maestro/"
          "$HOME/.maestro/bin/maestro" --version
      - name: Download Unity Xcode export
        uses: actions/download-artifact@v4
        with:
          name: prism-stack-ios-export
          path: build/iOS
          github-token: ${{ github.token }}
          run-id: ${{ inputs.export_run_id }}

      - name: Build for iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project build/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            SDKROOT=iphonesimulator \
            SUPPORTED_PLATFORMS=iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Boot 6.9-inch simulator and capture live app
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_TYPE=$(xcrun simctl list devicetypes | sed -n 's/.*iPhone 16 Pro Max.*(\(.*\))/\1/p' | head -1)
          if [ -z "$DEVICE_TYPE" ]; then
            DEVICE_TYPE=$(xcrun simctl list devicetypes | sed -n 's/.*iPhone 17 Pro Max.*(\(.*\))/\1/p' | head -1)
          fi
          test -n "$DEVICE_TYPE"
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; r=[x["identifier"] for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x.get("isAvailable",False)]; print(r[-1])')
          UDID=$(xcrun simctl create "AppStore-$APP_SLUG" "$DEVICE_TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -path '*iphonesimulator/*.app' -print -quit)
          echo "Installing $APP_PATH"
          test -n "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          BUILT_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          echo "Launching $BUILT_BUNDLE_ID"
          export UDID
          mkdir -p screenshots
          xcrun simctl spawn "$UDID" log stream --level debug --style compact --predicate 'process == "PrismStack" OR process == "UnityFramework"' > screenshots/live-runtime.log 2>&1 &
          LOGGER_PID=$!
          xcrun simctl launch --stdout="$PWD/screenshots/unity-stdout.log" --stderr="$PWD/screenshots/unity-stderr.log" "$UDID" "$BUILT_BUNDLE_ID" --playabilityQA
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force screenshots/gameplay.mov &
          RECORDER_PID=$!
          trap 'kill -INT "$RECORDER_PID" 2>/dev/null || true; kill "$LOGGER_PID" 2>/dev/null || true; wait "$RECORDER_PID" || true; cp -R "$HOME/.maestro/tests" screenshots/maestro-tests 2>/dev/null || true; xcrun simctl io "$UDID" screenshot screenshots/final.png || true' EXIT
          python3 .github/scripts/prism-native-qa.py
          xcrun simctl spawn "$UDID" log show --last 15m --style compact --predicate 'process == "Prism Stack"' > screenshots/runtime.log || true

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-stack-appstore-screenshots
          path: screenshots/
          if-no-files-found: error
          retention-days: 3

