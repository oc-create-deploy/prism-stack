name: Capture App Store Screenshots

on:
  workflow_dispatch:
    inputs:
      export_run_id:
        description: Workflow run containing the Unity iOS export
        required: true

permissions:
  actions: read
  contents: read

jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_SLUG: prism-stack
      APP_BUNDLE_ID: com.play.blockpuzzle
    steps:
      - name: Download Unity Xcode export
        uses: actions/download-artifact@v4
        with:
          name: prism-stack-ios-export
          path: build/iOS
          github-token: ${{ github.token }}
          run-id: ${{ inputs.export_run_id }}

      - name: Build for iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project build/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            SDKROOT=iphonesimulator \
            SUPPORTED_PLATFORMS=iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Boot 6.9-inch simulator and capture live app
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_TYPE=$(xcrun simctl list devicetypes | sed -n 's/.*iPhone 16 Pro Max.*(\(.*\))/\1/p' | head -1)
          if [ -z "$DEVICE_TYPE" ]; then
            DEVICE_TYPE=$(xcrun simctl list devicetypes | sed -n 's/.*iPhone 17 Pro Max.*(\(.*\))/\1/p' | head -1)
          fi
          test -n "$DEVICE_TYPE"
          RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c 'import json,sys; r=[x["identifier"] for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x.get("isAvailable",False)]; print(r[-1])')
          UDID=$(xcrun simctl create "AppStore-$APP_SLUG" "$DEVICE_TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -path '*iphonesimulator/*.app' -print -quit)
          echo "Installing $APP_PATH"
          test -n "$APP_PATH"
          xcrun simctl install "$UDID" "$APP_PATH"
          BUILT_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          echo "Launching $BUILT_BUNDLE_ID"
          xcrun simctl launch "$UDID" "$BUILT_BUNDLE_ID"
          mkdir -p screenshots
          sleep 8
          xcrun simctl io "$UDID" screenshot screenshots/01-launch.png
          sleep 8
          xcrun simctl io "$UDID" screenshot screenshots/02-live.png
          sleep 10
          xcrun simctl io "$UDID" screenshot screenshots/03-live.png
          sips -g pixelWidth -g pixelHeight screenshots/*.png

      - name: Upload screenshots to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 -m venv "$RUNNER_TEMP/asc-venv"
          "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet requests pyjwt cryptography
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/oc-create-deploy/2048/582709c0d411561d827c56207dbf2b9e4f7d07b5/scripts/upload-app-store-screenshots.py \
            --output "$RUNNER_TEMP/upload-app-store-screenshots.py"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" \
            "$RUNNER_TEMP/asc-venv/bin/python" "$RUNNER_TEMP/upload-app-store-screenshots.py" \
            --app-id 6812284455 \
            --directory screenshots \
            --display-type APP_IPHONE_67

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-stack-appstore-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 14

