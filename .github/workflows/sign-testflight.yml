name: Sign and Upload Prism Stack

on:
  workflow_dispatch:
    inputs:
      export_run_id:
        description: Workflow run containing prism-stack-ios-export
        required: true
      build_number:
        description: App Store build number
        required: true
        default: "1"

permissions:
  actions: read
  contents: read

jobs:
  archive-and-upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: com.play.blockpuzzle
      PROFILE_NAME: Prism Stack App Store
      KEYCHAIN_PASSWORD: temporary-build-keychain-password
    steps:
      - name: Download Unity Xcode export
        uses: actions/download-artifact@v4
        with:
          name: prism-stack-ios-export
          path: build/iOS
          github-token: ${{ github.token }}
          run-id: ${{ inputs.export_run_id }}

      - name: Install distribution certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/app-store.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - name: Stamp build and archive
        shell: bash
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build_number }}" build/iOS/Info.plist
          xcodebuild \
            -project build/iOS/Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/PrismStack.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Create App Store export options
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import plistlib

          options = {
              'destination': 'export',
              'manageAppVersionAndBuildNumber': False,
              'method': 'app-store-connect',
              'provisioningProfiles': {
                  os.environ['APP_BUNDLE_ID']: os.environ['PROFILE_NAME'],
              },
              'signingCertificate': 'Apple Distribution',
              'signingStyle': 'manual',
              'stripSwiftSymbols': True,
              'teamID': os.environ['APPLE_TEAM_ID'],
              'uploadSymbols': True,
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], 'ExportOptions.plist'), 'wb') as output:
              plistlib.dump(options, output)
          PY

      - name: Export IPA
        shell: bash
        run: >-
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/PrismStack.xcarchive"
          -exportPath "$RUNNER_TEMP/PrismStackExport"
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          PRIVATE_KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$PRIVATE_KEYS_DIR"
          printf '%s' "$ASC_PRIVATE_KEY" > "$PRIVATE_KEYS_DIR/AuthKey_$ASC_KEY_ID.p8"
          IPA_PATH=$(find "$RUNNER_TEMP/PrismStackExport" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prism-stack-ios-${{ inputs.build_number }}
          path: ${{ runner.temp }}/PrismStackExport/*.ipa
          if-no-files-found: ignore
          retention-days: 14
